name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1
      - name: Install locked package and test dependencies
        run: uv sync --locked --extra dev
      - name: Download and verify official KOST v1.3 FILES fixture
        run: uv run --locked python tools/prepare_kost_fixture.py
      - name: Run tests with required conformance fixture
        env:
          PACKAGE_TURBO_REQUIRE_KOST_FIXTURE: "1"
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python -m pytest -q