name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Download and verify official KOST v1.3 FILES fixture
        run: python tools/prepare_kost_fixture.py
      - name: Run tests with required conformance fixture
        env:
          PACKAGE_TURBO_REQUIRE_KOST_FIXTURE: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q