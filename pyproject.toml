[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "package-turbo"
version = "0.1.0"
description = "Package Turbo - re-implementation of the BAR Package Handler (eCH-0160 SIP) with PySide6 and QML."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.9",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
package-turbo = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["ph_backend", "App"]

[tool.setuptools.package-data]
App = ["*.qml", "qmldir", "icons/*.svg", "i18n/*.qm"]
ph_backend = ["resources/xsd/*.xsd"]

[tool.pyside6-project]
files = [
    "main.py",
    "App/qmldir",
    "App/Main.qml",
    "App/KindBadge.qml",
    "App/NavigatorView.qml",
    "App/MetadataEditor.qml",
    "App/DataTable.qml",
    "App/ValidationView.qml",
    "App/NotesView.qml",
    "App/SampleView.qml",
    "App/SearchView.qml",
    "App/TimeSpanChart.qml",
    "App/EditMenu.qml",
    "App/InputDialog.qml",
    "App/NewPackageDialog.qml",
    "App/MassAssignDialog.qml",
    "App/MassEditDialog.qml",
    "App/PreferencesDialog.qml",
    "App/AdditionalDataEditor.qml",
    "App/i18n/package_turbo_fr.ts",
    "ph_backend/__init__.py",
    "ph_backend/schema.py",
    "ph_backend/timespan.py",
    "ph_backend/file_formats.py",
    "ph_backend/xsd_info.py",
    "ph_backend/sip.py",
    "ph_backend/files.py",
    "ph_backend/structure.py",
    "ph_backend/notes.py",
    "ph_backend/search.py",
    "ph_backend/sampling.py",
    "ph_backend/statistics.py",
    "ph_backend/reports.py",
    "ph_backend/fixes.py",
    "ph_backend/package_factory.py",
    "ph_backend/navigators.py",
    "ph_backend/tables.py",
    "ph_backend/editor.py",
    "ph_backend/validation.py",
    "ph_backend/backend.py",
    "ph_backend/controllers.py",
]

[tool.pyside6.deploy]
title = "Package Turbo"
input_file = "main.py"
exec_directory = "dist"
icon = "App/icons/app.ico"
mode = "standalone"
extra_args = "--windows-console-mode=disable --include-data-dir=ph_backend/resources=ph_backend/resources --include-data-dir=App=App"

[tool.pytest.ini_options]
testpaths = ["tests"]
